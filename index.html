<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Resume - Clément LAFON</title>

    <meta name="description" content="LAFON Clément's resume.">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#E7F8FF">

    <link rel="canonical" href="https://l-clem.github.io/cv/">
    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="./assets/img/favicon.png"
    >

    <meta
        property="og:image"
        content="https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?fm=jpg&fit=crop&w=1200&h=630&q=70"
    >

    <meta property="og:title" content="LAFON Clément's resume">
    <meta property="og:description" content="LAFON Clément's resume.">

    <script
        src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous">
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body,
        #app {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        body {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100dvh;

            overscroll-behavior: none;
            background: #fff;
        }

        #app {
            position: absolute;
            inset: 0;
        }

        .pdf-viewer {
            display: block;

            width: 100%;
            height: 100%;

            border: 0;
        }

        .fallback {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;

            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            text-align: center;
        }
    </style>
</head>

<body>

    <main
        id="app"
        hx-get="./assets/html/pdf-viewer.html"
        hx-trigger="pdf:load"
        hx-swap="innerHTML">
    </main>

    <script>
        (() => {
            const PDF_URL =
                "./assets/pdf/resume.pdf";

            const ua = navigator.userAgent || "";

            const isIOS =
                /iPhone|iPad|iPod/i.test(ua) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                );

            const isAndroid =
                /Android/i.test(ua);

            const coarsePointer =
                window.matchMedia("(pointer: coarse)").matches;

            const smallScreen =
                window.matchMedia("(max-width: 900px)").matches;

            const problematicEmbeddedViewer =
                isIOS ||
                isAndroid ||
                (coarsePointer && smallScreen);

            const pdfViewerDisabled =
                "pdfViewerEnabled" in navigator &&
                navigator.pdfViewerEnabled === false;

            /*
             * Mobile / tablette :
             * utilisation de la visionneuse PDF native.
             */
            if (problematicEmbeddedViewer) {
                window.location.replace(PDF_URL);
                return;
            }

            /*
             * Pas de lecteur PDF intégré :
             * affiche un fallback.
             */
            if (pdfViewerDisabled) {
                document.querySelector("#app").innerHTML = `
                    <div class="fallback">
                        <div>
                            <p>
                                Your browser cannot display the PDF.
                            </p>

                            <a href="${PDF_URL}">
                                Open resume
                            </a>
                        </div>
                    </div>
                `;

                return;
            }

            /*
             * Desktop :
             * demande à HTMX de charger le fragment PDF.
             */
            htmx.trigger("#app", "pdf:load");
        })();
    </script>

</body>

</html>

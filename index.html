<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Resume - Clément LAFON</title>

    <meta
        name="description"
        content="LAFON Clément's resume."
    >

    <meta
        name="format-detection"
        content="telephone=no"
    >

    <meta
        name="theme-color"
        content="#E7F8FF"
    >

    <link
        rel="canonical"
        href="https://l-clem.github.io/cv/"
    >

    <link
        rel="icon"
        type="image/png"
        href="/cv/assets/img/favicon.png?v=2"
    >

    <link
        rel="apple-touch-icon"
        href="/cv/assets/img/favicon.png?v=2"
    >

    <meta
        property="og:title"
        content="LAFON Clément's resume"
    >

    <meta
        property="og:description"
        content="LAFON Clément's resume."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://l-clem.github.io/cv/"
    >

    <meta
        property="og:image"
        content="https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?fm=jpg&fit=crop&w=1200&h=630&q=70"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        crossorigin="anonymous">
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
            background: #ffffff;
        }

        html {
            overscroll-behavior: none;
        }

        body {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            overflow: hidden;
            overscroll-behavior: none;
        }

        #app {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        .pdf-viewer {
            position: absolute;
            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: #ffffff;
        }

        .fallback {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;

            padding:
                max(24px, env(safe-area-inset-top))
                max(24px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(24px, env(safe-area-inset-left));

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            text-align: center;
            background: #ffffff;
        }

        .fallback-content {
            max-width: 420px;
        }

        .fallback a {
            display: inline-block;

            margin-top: 12px;
            padding: 12px 18px;

            color: #ffffff;
            text-decoration: none;

            background: #111111;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <main id="app"></main>

    <noscript>
        <div class="fallback">
            <div class="fallback-content">
                <p>
                    JavaScript is required to display this resume.
                </p>

                <a href="/cv/assets/pdf/resume.pdf">
                    Open resume
                </a>
            </div>
        </div>
    </noscript>

    <script>
        (() => {
            const PDF_URL =
                "/cv/assets/pdf/resume.pdf";

            const VIEWER_URL =
                "/cv/assets/html/pdf-viewer.html";

            const app =
                document.getElementById("app");

            const userAgent =
                navigator.userAgent || "";

            const isIOS =
                /iPhone|iPad|iPod/i.test(userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                );

            const isAndroid =
                /Android/i.test(userAgent);

            const isMobileUA =
                navigator.userAgentData?.mobile === true;

            const coarsePointer =
                window.matchMedia(
                    "(pointer: coarse)"
                ).matches;

            const smallScreen =
                window.matchMedia(
                    "(max-width: 900px)"
                ).matches;

            const isMobileOrTablet =
                isIOS ||
                isAndroid ||
                isMobileUA ||
                (
                    coarsePointer &&
                    smallScreen
                );

            const showFallback = () => {
                app.innerHTML = `
                    <div class="fallback">
                        <div class="fallback-content">

                            <p>
                                Your browser cannot display the resume correctly.
                            </p>

                            <a href="${PDF_URL}">
                                Open resume
                            </a>

                        </div>
                    </div>
                `;
            };

            /*
             * Mobile / tablette :
             * PDF directement dans la visionneuse native.
             */
            if (isMobileOrTablet) {
                window.location.replace(PDF_URL);
                return;
            }

            /*
             * Lecteur PDF explicitement désactivé.
             */
            if (
                "pdfViewerEnabled" in navigator &&
                navigator.pdfViewerEnabled === false
            ) {
                showFallback();
                return;
            }

            /*
             * Desktop :
             * chargement du fragment via HTMX.
             */
            const loadDesktopViewer = () => {
                if (typeof htmx === "undefined") {
                    showFallback();
                    return;
                }

                htmx.ajax(
                    "GET",
                    VIEWER_URL,
                    {
                        target: "#app",
                        swap: "innerHTML"
                    }
                );
            };

            if (document.readyState === "loading") {
                document.addEventListener(
                    "DOMContentLoaded",
                    loadDesktopViewer,
                    {
                        once: true
                    }
                );
            } else {
                loadDesktopViewer();
            }

            document.body.addEventListener(
                "htmx:responseError",
                showFallback
            );

            document.body.addEventListener(
                "htmx:sendError",
                showFallback
            );
        })();
    </script>

</body>

</html>
